name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          pip install pyinstaller build

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Run static checks
        run: python -m compileall hangman_nogui

      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build_mac.sh
          ./scripts/build_mac.sh

      - name: Install PyInstaller for Windows python launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: py -3 -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: hangman-macos
          path: dist/mac/Hangman.dmg

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hangman-windows
          path: dist/windows/pyinstaller/Hangman.exe
