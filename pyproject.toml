[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hangman-nogui"
version = "0.1.0"
description = "Terminal Hangman game with Rich-powered layout."
authors = [{ name = "Just Ernst" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "english-words>=1.1.0",
]

[project.scripts]
hangman = "hangman:main"

[tool.setuptools]
py-modules = ["hangman", "images"]
